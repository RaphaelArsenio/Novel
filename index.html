<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Novel Studio</title>
<style>
:root{--bg:#fbfaf7;--panel:#f1eee7;--fg:#222;--mute:#807a6e;--line:#ddd8cc;--acc:#8a4b2a;--accfg:#fff;--ff:Georgia,serif;--fs:19px;--lh:1.7;--w:680px;--edbg:#fbfaf7;--edfg:#222;--hbg:#f4ecd8;--hfg:#4a3b27;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="sepia"]{--bg:#f4ecd8;--panel:#e9dfc4;--fg:#4a3b27;--mute:#8b7a5c;--line:#d6c9a6;--acc:#8a4b2a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-theme="sepia"]){--bg:#17181b;--panel:#202226;--fg:#dcdad4;--mute:#8b8d93;--line:#33363b;--acc:#d9955f;--accfg:#17181b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17181b;--panel:#202226;--fg:#dcdad4;--mute:#8b8d93;--line:#33363b;--acc:#d9955f;--accfg:#17181b;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
select{color:var(--fg)}
#home{flex:1;overflow-y:auto;padding:18px 16px 40px;background-color:var(--hbg);color:var(--hfg)}
#home[data-d="1"]{background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,color-mix(in srgb,var(--hfg) 15%,transparent) 31px,color-mix(in srgb,var(--hfg) 15%,transparent) 32px)}
#home[data-d="2"]{background-image:radial-gradient(color-mix(in srgb,var(--hfg) 22%,transparent) 1px,transparent 1.5px);background-size:22px 22px}
#home[data-d="3"]{background-image:radial-gradient(ellipse at top,color-mix(in srgb,var(--hfg) 14%,transparent),transparent 70%)}
#home>*{max-width:900px;margin-left:auto;margin-right:auto}
.ht{display:flex;justify-content:space-between;align-items:center}
h1{font:600 28px Georgia,serif;margin:0}
.crumb,.nb{margin:12px auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.big{width:100%;padding:12px;margin:4px auto 0;display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{border:1px solid color-mix(in srgb,var(--hfg) 25%,transparent);border-radius:12px;background:color-mix(in srgb,var(--hfg) 7%,var(--hbg));overflow:hidden}
.cb{padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cb input{background:var(--bg);border:1px solid var(--acc);border-radius:6px;padding:4px}
.ty{font-size:12px;opacity:.7;text-transform:capitalize}
.cb small{opacity:.7}
.ca{display:flex;gap:4px;padding:6px 8px;border-top:1px solid color-mix(in srgb,var(--hfg) 18%,transparent)}
.ca button{padding:3px 7px;font-size:12px}
.empty{opacity:.7}
#edw{flex:1;display:none;flex-direction:column;min-height:0}
header{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
#bt{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tw{color:var(--mute);font-size:13px;white-space:nowrap}
#app{flex:1;display:flex;min-height:0;position:relative}
aside{position:absolute;z-index:5;inset:0 auto 0 0;width:min(86%,320px);background:var(--panel);border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .2s;display:flex;flex-direction:column}
aside.open{transform:none}
.tabs{display:flex;gap:6px;padding:10px}
.tabs button{flex:1}.tabs button.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
#list{flex:1;overflow-y:auto;padding:0 10px}
.ch{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;margin-bottom:6px}
.ch.on{border-color:var(--acc);box-shadow:inset 3px 0 var(--acc)}
.ch small{color:var(--mute)}
.acts{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line);flex-wrap:wrap}
.note{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;background:var(--bg)}
.note input,.note textarea{width:100%;background:none;border:0;outline:none;resize:vertical}
.note input{font-weight:600;margin-bottom:4px}.note textarea{min-height:80px;font-size:14px}
main{flex:1;display:flex;flex-direction:column;min-width:0;background-color:var(--edbg);color:var(--edfg)}
body[data-ed="2"] main{background-image:radial-gradient(color-mix(in srgb,var(--edfg) 22%,transparent) 1px,transparent 1.5px);background-size:22px 22px}
body[data-ed="3"] main{background-image:radial-gradient(ellipse at top,color-mix(in srgb,var(--edfg) 12%,transparent),transparent 70%)}
body[data-ed="1"] #ed{background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--fs)*var(--lh) - 1px),color-mix(in srgb,var(--edfg) 18%,transparent) calc(var(--fs)*var(--lh) - 1px),color-mix(in srgb,var(--edfg) 18%,transparent) calc(var(--fs)*var(--lh)));background-attachment:local;background-position:0 10px}
#ct{margin:12px auto 0;width:100%;max-width:var(--w);padding:0 16px;background:none;border:0;outline:none;font:600 22px var(--ff)}
#ed{flex:1;width:100%;max-width:var(--w);margin:0 auto;padding:10px 16px 40px;background:none;border:0;outline:none;resize:none;font-family:var(--ff);font-size:var(--fs);line-height:var(--lh)}
footer{padding:8px 14px;border-top:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute)}
#bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
#set{position:fixed;z-index:20;right:8px;top:calc(8px + env(safe-area-inset-top,0px));width:min(92%,330px);max-height:85%;overflow-y:auto;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:14px;display:none;box-shadow:0 8px 30px #0003}
#set.open{display:block}
#set label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0;font-size:14px}
#set input[type=range]{width:140px}
#set select,#set input[type=number]{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px}
#set input[type=number]{width:80px}
#set h4{margin:14px 0 6px}
.sw{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}
.sw button{width:30px;height:30px;border-radius:50%;padding:0}
.sw button.on{outline:2px solid var(--acc);outline-offset:2px}
body.focus header,body.focus footer,body.focus aside,body.focus #ct{opacity:0;pointer-events:none;height:0;padding:0;margin:0;border:0;overflow:hidden}
#fx{display:none;position:fixed;right:10px;top:calc(10px + env(safe-area-inset-top,0px));z-index:9;opacity:.5}
body.focus #fx{display:block}
@media(min-width:820px){aside{position:static;transform:none;width:280px}#mb{display:none}}
.sh{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-14px;background:var(--panel);padding:6px 0;z-index:1}
.cap{font-size:13px;color:var(--mute);margin:-2px 0 8px}
body.sc main{background-image:linear-gradient(color-mix(in srgb,var(--edbg) 55%,transparent),color-mix(in srgb,var(--edbg) 55%,transparent)),var(--edimg);background-size:cover;background-position:center;background-repeat:no-repeat}
#home.sc{background-image:linear-gradient(color-mix(in srgb,var(--hbg) 55%,transparent),color-mix(in srgb,var(--hbg) 55%,transparent)),var(--himg);background-size:cover;background-position:center;background-repeat:no-repeat}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
#home.in>*{animation:fade .45s both}
.card{animation:up .4s both;animation-delay:calc(var(--i,0)*45ms)}
#edw.in{animation:fade .4s both}
.ch,.note{animation:up .3s both}
#set.open{animation:up .25s both}
button{transition:transform .12s,border-color .15s}button:active{transform:scale(.94)}
@keyframes spark{0%{opacity:0;transform:translate(0,0) scale(.3)}30%{opacity:1;transform:translate(calc(var(--dx)*.4),calc(var(--dy)*.4)) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}}
.sp{position:fixed;z-index:50;pointer-events:none;border-radius:50%;background:#fff;box-shadow:0 0 6px 2px var(--acc);animation:spark .8s ease-out both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.sp{display:none}}
</style>
</head>
<body>
<div id="home"></div>
<div id="edw">
<header>
<button id="mb" aria-label="Chapters">☰</button>
<button id="hm">⌂ Library</button>
<span id="bt"></span>
<span id="tw"></span>
<button id="fb">Focus</button>
<button id="gb" aria-label="Settings">⚙</button>
</header>
<div id="app">
<aside id="side">
<div class="tabs"><button id="t1" class="on">Chapters</button><button id="t2">Notes</button></div>
<div id="list"></div>
<div class="acts" id="acts"></div>
</aside>
<main>
<input id="ct" aria-label="Chapter title">
<textarea id="ed" placeholder="Begin your story…"></textarea>
<footer><span id="cw"></span><div id="bar"><i></i></div><span id="gl"></span></footer>
</main>
</div>
</div>
<div id="set">
<div class="sh"><strong>Settings</strong><button id="sx">✕ Close</button></div>
<h4>Writing area background</h4>
<div class="sw" id="swE" data-k="ec"></div>
<div class="sw" id="dE" data-k="ed"></div><div class="cap" id="cE"></div>
<h4>Start screen background</h4>
<div class="sw" id="swH" data-k="hc"></div>
<div class="sw" id="dH" data-k="hd"></div><div class="cap" id="cH"></div>
<h4>Writing</h4>
<label>Interface theme<select data-k="theme"><option value="auto">Auto</option><option value="light">Light</option><option value="sepia">Sepia</option><option value="dark">Dark</option></select></label>
<label>Font<select data-k="font"><option value="Georgia,serif">Georgia</option><option value="'Palatino Linotype',Palatino,serif">Palatino</option><option value="system-ui,sans-serif">Sans-serif</option><option value="ui-monospace,Menlo,monospace">Typewriter</option></select></label>
<label>Size<input type="range" data-k="size" min="14" max="30"></label>
<label>Line spacing<input type="range" data-k="lh" min="1.3" max="2.4" step="0.1"></label>
<label>Page width<input type="range" data-k="width" min="400" max="1000" step="20"></label>
<label>Curly quotes as I type<input type="checkbox" data-k="quotes"></label>
<label>Spellcheck<input type="checkbox" data-k="spell"></label>
<label>Click sparkles<input type="checkbox" data-k="spark"></label>
<label>Daily word goal<input type="number" data-k="goal" min="0" step="50"></label>
<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px">
<button id="cpc">Copy chapter</button><button id="cpa">Copy all in this folder</button>
</div>
<p id="msg" style="color:var(--mute);font-size:13px;margin:8px 0 0"></p>
</div>
<button id="fx">Exit focus</button>

 if(t==='chapter')n.text='';S.nodes.push(n);save();if(t==='chapter')open(n.id);else if(S.view==='home'){ren=n.id;home()}}
function open(id){S.cur=id;S.view='edit';S.at=node(id).parent;save();show()}
function del(n){const ids=[n.id,...desc(n.id).map(d=>d.id)];S.nodes=S.nodes.filter(x=>!ids.includes(x.id));if(ids.includes(S.cur))S.cur=null;dl=null;save();home()}

function home(){
 const H=$('#home');H.innerHTML='';
 const go=id=>()=>{S.at=id;mv=ren=dl=null;home();save()};
 const cr=el('div',{className:'crumb'},el('button',{textContent:'Library',onclick:go(null)}));
 path(node(S.at)).forEach(n=>cr.append('›',el('button',{textContent:n.title,onclick:go(n.id)})));
 H.append(el('div',{className:'ht'},el('h1',{textContent:'Novel Studio'}),el('button',{textContent:'⚙ Settings',onclick:()=>$('#set').classList.toggle('open')})),cr);
 const c=node(S.cur);
 if(c)H.append(el('button',{className:'pri big',textContent:'Continue writing: '+c.title,onclick:()=>open(c.id)}));
 const nb=el('div',{className:'nb'},'New:');
 ['folder','series','volume','arc','chapter'].forEach(t=>nb.append(el('button',{textContent:IC[t]+' '+t,onclick:()=>add(t)})));
 H.append(nb);
 if(mv){const m=node(mv),bad=[m.id,...desc(m.id).map(d=>d.id)],sel=el('select');
  sel.append(el('option',{value:'',textContent:'Library (top level)'}));
  S.nodes.filter(n=>n.type!=='chapter'&&!bad.includes(n.id)).forEach(n=>sel.append(el('option',{value:n.id,textContent:path(n).map(p=>p.title).join(' › ')})));
  H.append(el('div',{className:'nb'},'Move “'+m.title+'” to',sel,el('button',{className:'pri',textContent:'Move',onclick:()=>{m.parent=sel.value===''?null:Number(sel.value);mv=null;home();save()}}),el('button',{textContent:'Cancel',onclick:()=>{mv=null;home()}})));}
 const g=el('div',{className:'grid'}),ks=kid(S.at);
 if(!ks.length)g.append(el('p',{className:'empty',textContent:'Nothing here yet. Use the New buttons above to begin.'}));
 ks.forEach(n=>{
  const ti=ren===n.id?el('input',{value:n.title,onkeydown:e=>{if(e.key==='Enter')e.target.blur()},onblur:e=>{n.title=e.target.value.trim()||n.title;ren=null;save();home()}}):el('strong',{textContent:n.title});
  const body=el('div',{className:'cb',onclick:()=>{if(ren===n.id)return;n.type==='chapter'?open(n.id):go(n.id)()}},el('span',{className:'ty',textContent:IC[n.type]+' '+n.type}),ti,el('small',{textContent:words(n).toLocaleString()+' words'+(n.type==='chapter'?'':' · '+kid(n.id).length+' items')}));
  const a=el('div',{className:'ca'},el('button',{textContent:'Rename',onclick:()=>{ren=n.id;home()}}),el('button',{textContent:'Move',onclick:()=>{mv=n.id;home()}}),el('button',{textContent:dl===n.id?'Tap again to delete':'Delete',onclick:()=>{if(dl!==n.id){dl=n.id;home()}else del(n)}}));
  const cd=el('div',{className:'card'},body,a);cd.style.setProperty('--i',g.children.length);g.append(cd);
  if(ren===n.id)setTimeout(()=>{ti.focus();ti.select()},0);
 });
 H.append(g);
}

function stats(){const t=total(),d=Math.max(0,t-S.base.n),g=+S.set.goal||0,c=node(S.cur);
 $('#tw').textContent=t.toLocaleString()+' words';$('#cw').textContent=(c?wc(c.text):0).toLocaleString()+' in chapter';
 $('#gl').textContent=g?d+' / '+g+' today':d+' today';$('#bar i').style.width=g?Math.min(100,d/g*100)+'%':'0'}
function list(){
 const L=$('#list'),A=$('#acts'),c=node(S.cur);L.innerHTML='';A.innerHTML='';
 $('#t1').classList.toggle('on',tab===1);$('#t2').classList.toggle('on',tab===2);
 if(tab===1){
  const sibs=S.nodes.filter(n=>n.type==='chapter'&&n.parent===c.parent);
  sibs.forEach(s=>L.append(el('button',{className:'ch'+(s.id===S.cur?' on':''),onclick:()=>{S.cur=s.id;save();load();$('#side').classList.remove('open')}},el('span',{textContent:s.title}),el('small',{textContent:wc(s.text)}))));
  const mvb=d=>()=>{const i=sibs.indexOf(c),j=i+d;if(j<0||j>=sibs.length)return;const a=S.nodes.indexOf(c),b=S.nodes.indexOf(sibs[j]);[S.nodes[a],S.nodes[b]]=[S.nodes[b],S.nodes[a]];list();save()};
  A.append(el('button',{className:'pri',textContent:'+ Chapter',onclick:()=>add('chapter',c.parent)}),el('button',{textContent:'↑',onclick:mvb(-1)}),el('button',{textContent:'↓',onclick:mvb(1)}));
 }else{
  S.notes.forEach(n=>{const i=el('input',{value:n.title,placeholder:'Character, place, plot thread…',oninput:e=>{n.title=e.target.value;save()}}),
   t=el('textarea',{value:n.body,placeholder:'Details',oninput:e=>{n.body=e.target.value;save()}});
   L.append(el('div',{className:'note'},i,t,el('button',{textContent:'Remove',onclick:()=>{S.notes=S.notes.filter(m=>m!==n);list();save()}})))});
  A.append(el('button',{className:'pri',textContent:'+ Note',onclick:()=>{S.notes.unshift({title:'',body:''});list();save()}}));
 }
}
function load(){const c=node(S.cur);if(!c){S.view='home';show();return}
 $('#ct').value=c.title;$('#ed').value=c.text;$('#bt').textContent=path(node(c.parent)).map(p=>p.title).join(' › ')||'Library';list();stats()}
$('#ed').oninput=e=>{node(S.cur).text=e.target.value;stats();save()};
$('#ed').onblur=list;
$('#ct').oninput=e=>{node(S.cur).title=e.target.value;save()};$('#ct').onblur=list;
$('#hm').onclick=()=>{S.view='home';save();show()};
$('#ed').addEventListener('keydown',e=>{
 if(!S.set.quotes||(e.key!=='"'&&e.key!=="'")||e.ctrlKey||e.metaKey)return;
 const t=e.target,p=t.selectionStart,open=p===0||/[\s(\[—–-“‘]/.test(t.value[p-1]);
 e.preventDefault();t.setRangeText(e.key==='"'?(open?'“':'”'):(open?'‘':'’'),t.selectionStart,t.selectionEnd,'end');
 t.dispatchEvent(new Event('input'));
});
$('#t1').onclick=()=>{tab=1;list()};$('#t2').onclick=()=>{tab=2;list()};
$('#mb').onclick=()=>$('#side').classList.toggle('open');
$('#gb').onclick=()=>$('#set').classList.toggle('open');
const foc=on=>{document.body.classList.toggle('focus',on);$('#side').classList.remove('open');$('#set').classList.remove('open')};
$('#fb').onclick=()=>foc(true);$('#fx').onclick=()=>foc(false);
document.addEventListener('keydown',e=>{if(e.key==='Escape')foc(false)});
[['swE','ec'],['swH','hc']].forEach(([id,k])=>PAL.forEach((p,i)=>{
 const b=el('button',{title:p[0],onclick:()=>{S.set[k]=i;apply();save()}});b.style.background=p[1];b.dataset.i=i;$('#'+id).append(b)}));
[['dE','ed'],['dH','hd']].forEach(([id,k])=>DES.forEach((n,i)=>{const b=el('button',{title:n,textContent:i<4?['▭','≡','∷','◌'][i]:'',onclick:()=>{S.set[k]=i;apply();save()}});if(i>3){b.style.backgroundImage=SC[i];b.style.backgroundSize='cover';b.style.backgroundPosition='center'}b.dataset.i=i;$('#'+id).append(b)}));
document.querySelectorAll('#set input[data-k],#set select[data-k]').forEach(x=>{
 const k=x.dataset.k,v=S.set[k];if(x.type==='checkbox')x.checked=!!v;else x.value=v;
 x.oninput=x.onchange=()=>{const r=x.type==='checkbox'?x.checked:x.value;S.set[k]=x.type==='checkbox'?r:(/^-?[\d.]+$/.test(r)?+r:r);apply();stats();save()};
});
async function cp(t){try{await navigator.clipboard.writeText(t);$('#msg').textContent='Copied to clipboard.'}catch(e){$('#msg').textContent='Copy was blocked here. Select the text and copy manually.'}}
$('#cpc').onclick=()=>{const c=node(S.cur);if(c)cp(c.title+'\n\n'+c.text)};
$('#cpa').onclick=()=>cp(S.nodes.filter(n=>n.type==='chapter'&&(S.view==='edit'?n.parent===(node(S.cur)||{}).parent:desc(S.at).includes(n))).map(c=>c.title+'\n\n'+c.text).join('\n\n* * *\n\n'));
$('#sx').onclick=()=>$('#set').classList.remove('open');
document.addEventListener('click',e=>{if(!S.set.spark||matchMedia('(prefers-reduced-motion:reduce)').matches)return;const b=e.target.closest('button');if(!b)return;
 const r=b.getBoundingClientRect(),R=Math.random;
 for(let i=0;i<7;i++){const s=el('span',{className:'sp'}),z=2+R()*3;
  s.style.cssText=`left:${r.left+R()*r.width}px;top:${r.top+R()*r.height}px;width:${z}px;height:${z}px;--dx:${(R()-.5)*34}px;--dy:${-10-R()*28}px;animation-delay:${i*45}ms`;
  document.body.append(s);setTimeout(()=>s.remove(),1000)}},true);
apply();show();save();
</script>
</body>
